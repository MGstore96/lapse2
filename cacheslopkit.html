<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

var msgsEl = document.getElementById("msgs");
var isRedirecting = false;

function setMsg(text) {
  if (msgsEl) {
    msgsEl.innerHTML = text;
  }
}

function redirectSameWindow() {
  if (isRedirecting) return;
  isRedirecting = true;
  setTimeout(function () {
    window.location.replace("index.html");
  }, 1500);
}

function DLProgress(e) {
  if (e && e.total > 0) {
    var percent = Math.round((e.loaded / e.total) * 100);
    setMsg("Menginstal Cache Offline: " + percent + "%");
  } else {
    setMsg("Menginstal Cache Offline...");
  }
}

function DisplayCacheProgress() {
  setMsg("Cache Berhasil Diinstal");
  redirectSameWindow();
}

if (window.applicationCache) {
  window.applicationCache.addEventListener("progress", DLProgress, false);
  window.applicationCache.oncached = function () { DisplayCacheProgress(); };
  window.applicationCache.onupdateready = function () { DisplayCacheProgress(); };
  window.applicationCache.onerror = function () {
    setMsg("Kesalahan Saat Menginstal Cache! - Bersihkan dan Buka Kembali Browser Anda ...");
  };
}
</script>
</body>
